[project]
name = "fruity"
version = "0.2.0"
description = "A food image classifier, trained, deployed and measured as a small production service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Anders Henriksen", email = "anhenr.dev@gmail.com" }]
dependencies = ["pydantic>=2.9", "pyyaml>=6.0"]

[project.optional-dependencies]
serving = [
    "fastapi>=0.115",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "timm>=1.0",
    "torch>=2.8",
    "torchvision>=0.23",
    "uvicorn>=0.34",
]
training = [
    "hydra-colorlog>=1.2",
    "hydra-core>=1.3",
    "lightning>=2.5",
    "rich>=13.7",
    "timm>=1.0",
    "torch>=2.8",
    "torchmetrics>=1.6",
    "torchvision>=0.23",
    "wandb>=0.19",
]
frontend = ["pydantic>=2.9", "requests>=2.32", "streamlit>=1.40"]
evaluation = [
    "matplotlib>=3.11.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "psutil>=7.2.2",
]

[project.scripts]
fruity = "fruity.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CUDA on the Windows machine that trains. CPU on Linux, where CI runs, because it needs no GPU and is 2 GB smaller.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/F/I/W: pyflakes, pycodestyle and import order. ANN: every function has input and output types.
# D: Google-style docstrings. B/SIM/C4/UP: bugbear, simplification, comprehensions, pyupgrade.
# COM812: a trailing comma on multi-line calls, so exploded arguments stay exploded. RUF: ruff's own checks.
select = ["E", "F", "I", "W", "ANN", "D", "B", "SIM", "C4", "UP", "COM812", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names and classes already say what they cover. Module docstrings are still required.
"tests/**" = ["D101", "D102", "D103"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# These ship without type information.
[[tool.mypy.overrides]]
module = ["hydra.*", "onnxruntime.*", "psutil.*", "timm.*", "torchvision.*", "wandb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
