<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">From data to the running service</title>
  <desc id="desc">Food-101 is split into training, validation and a closed test set. Four models are trained on a local GPU and a Weights and Biases sweep tunes the chosen one. A rule fixed in advance picks convnext_tiny on validation data. fruity finalize checks that the ONNX file matches PyTorch, then reads the test set once. The ONNX file is published as a GitHub release with a checksum, the image build verifies it, and the service runs it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#81a8d6"/>
    </marker>
  </defs>
  <rect width="640" height="900" fill="#0d1114"/>

  <rect x="60" y="20" width="520" height="92" rx="8" fill="#1b2129" stroke="#3a4656"/>
  <text x="320" y="48" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">Food-101: 101 foods, 101,000 photos</text>
  <text x="320" y="74" fill="#a7b3c2" font-size="14" text-anchor="middle">68,175 training and 7,575 validation, from the training split</text>
  <text x="320" y="96" fill="#a7b3c2" font-size="14" text-anchor="middle">25,250 test, closed until the end</text>
  <line x1="320" y1="112" x2="320" y2="143" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="145" width="520" height="92" rx="8" fill="#1b2129" stroke="#3a4656"/>
  <text x="320" y="173" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">Train on a local GPU</text>
  <text x="320" y="199" fill="#a7b3c2" font-size="14" text-anchor="middle">4 pretrained models, each with its own learning rate</text>
  <text x="320" y="221" fill="#a7b3c2" font-size="14" text-anchor="middle">then a Weights &amp; Biases sweep of 6 runs</text>
  <line x1="320" y1="237" x2="320" y2="268" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="270" width="520" height="92" rx="8" fill="#1b2129" stroke="#81a8d6" stroke-width="1.5"/>
  <text x="320" y="298" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">fruity compare: a rule set in advance</text>
  <text x="320" y="324" fill="#a7b3c2" font-size="14" text-anchor="middle">smallest model within 3 points of the best on validation</text>
  <text x="320" y="346" fill="#a7b3c2" font-size="14" text-anchor="middle">chooses convnext_tiny: 88.13% on validation</text>
  <line x1="320" y1="362" x2="320" y2="393" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="395" width="520" height="92" rx="8" fill="#1b2129" stroke="#81a8d6" stroke-width="1.5"/>
  <text x="320" y="423" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">fruity finalize: the test set, once</text>
  <text x="320" y="449" fill="#a7b3c2" font-size="14" text-anchor="middle">ONNX must match PyTorch on validation first</text>
  <text x="320" y="471" fill="#a7b3c2" font-size="14" text-anchor="middle">91.66% on test; a lock refuses a second read</text>
  <line x1="320" y1="487" x2="320" y2="518" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="520" width="520" height="70" rx="8" fill="#1b2129" stroke="#3a4656"/>
  <text x="320" y="548" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">GitHub release</text>
  <text x="320" y="574" fill="#a7b3c2" font-size="14" text-anchor="middle">model.onnx and labels.json, with SHA-256 checksums</text>
  <line x1="320" y1="590" x2="320" y2="621" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="623" width="520" height="70" rx="8" fill="#1b2129" stroke="#3a4656"/>
  <text x="320" y="651" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">Image build: fruity fetch</text>
  <text x="320" y="677" fill="#a7b3c2" font-size="14" text-anchor="middle">refuses a file whose checksum differs</text>
  <line x1="320" y1="693" x2="320" y2="724" stroke="#81a8d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="726" width="520" height="92" rx="8" fill="#1b2129" stroke="#3a4656"/>
  <text x="320" y="754" fill="#e4eaf2" font-size="16" text-anchor="middle" font-weight="600">The service</text>
  <text x="320" y="780" fill="#a7b3c2" font-size="14" text-anchor="middle">ONNX Runtime, no PyTorch</text>
  <text x="320" y="802" fill="#a7b3c2" font-size="14" text-anchor="middle">the same preprocessing code as evaluation</text>

  <text x="320" y="860" fill="#a7b3c2" font-size="13" text-anchor="middle">Every number here comes from a file in evals/.</text>
</svg>
