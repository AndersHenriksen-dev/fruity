# The whole service on one machine, with no cloud account: docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports: ["8000:8000"]
    cpus: 1
    mem_limit: 2g

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      FRUITY_API_ENDPOINT: http://api:8000/batch/classification
    ports: ["8501:8501"]
    cpus: 0.25
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
