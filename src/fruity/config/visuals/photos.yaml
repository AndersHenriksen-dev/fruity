# Read by lib/visuals/photos.py: one openly licensed photo per dish from Wikimedia Commons, for the graphics
api_url: https://commons.wikimedia.org/w/api.php
# Commons asks automated clients to name themselves and give a way to reach them.
user_agent: fruity-portfolio/1.0 (https://github.com/AndersHenriksen-dev/fruity)
# Public domain, CC0 and CC BY only. Share-alike, non-commercial and no-derivatives licences are left out, because
# the graphics crop and combine photos.
allowed_licences: ['^cc0$', '^public domain$', '^pd$', '^cc by \d(\.\d)?$']
min_width: 400
download_width: 512
candidates: 15
request_pause_seconds: 0.3
photo_dir: data/photos
credits_path: docs/images/photos/CREDITS.md
manifest_path: docs/images/photos/photos.json
# A different search where the class name finds the wrong things.
search_terms:
  cup_cakes: cupcake
# The file for each dish, checked by eye to show it. Pinned, so the photos do not change with search results.
