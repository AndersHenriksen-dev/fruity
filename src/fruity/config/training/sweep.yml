# Read by Weights & Biases: wandb sweep --project fruity src/fruity/config/training/sweep.yml
program: src/fruity/lib/training/train.py
method: bayes
run_cap: 6
metric:
  goal: maximize
  name: val/acc

parameters:
  model.optimizer.lr:
    distribution: log_uniform_values
    min: 0.00003
    max: 0.0003
  model.optimizer.weight_decay:
    min: 0.0
    max: 0.1

command:
  # On Windows a plain interpreter resolves to the base Python, which has none of this project's packages.
  - uv
  - run
  - ${program}
  - experiment=convnext_tiny
  - logging.run=true
  - ~callbacks.rich_progress_bar
  - +trainer.enable_progress_bar=false
  - ${args_no_hyphens}
