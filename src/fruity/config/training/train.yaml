# Read by lib/training/train.py: everything a training run uses
defaults:
  - _self_
  - datamodule: foods_101.yaml
  - model: timm_model.yaml
  - callbacks: default.yaml
  - trainer: default.yaml
  - paths: default.yaml
  - hydra: default.yaml
  - logging: wandb.yaml
  # An experiment overrides any of the above, such as `experiment=convnext`.
  - experiment: null

task_name: train
tags: [dev]
seed: 42
# Set True only for the final run of the chosen setup: the test set must not influence the choice.
test: False
ckpt_path: null
